<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#fff;color:#1d1d1d;font-family:Figtree,-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
img{display:block;max-width:100%}
#app{position:relative;height:100dvh;overflow:hidden;--fk-nav:0px;--fk-bg:rgba(29,29,29,.95);--fk-accent:#fff;--fk-font:Figtree,system-ui,sans-serif}
.page{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.site{display:none}.site.on{display:block}
/* site themes */
.site{--promo:#eaa385;--promo-ink:#1d1d1d;--head:#fff;--head-ink:#1d1d1d;--sub:#0f1b2d;--sub-ink:#fff;--hero:#ead7f6;--chip:#fff;--link:#6b3fa0;--hfont:Fraunces,Georgia,serif;--hweight:800;--hcase:none;--hspace:-.01em;--h2size:30px}
.site.mj{--promo:#120e0b;--promo-ink:#fff;--head:#120e0b;--head-ink:#fff;--sub:#d53216;--sub-ink:#fff;--hero:#eddec7;--link:#b5280f;--hfont:"Bebas Neue",Impact,"Arial Narrow",sans-serif;--hweight:400;--hspace:.01em;--h2size:36px}
.site.ph{--promo:#0f6e63;--promo-ink:#fff;--head:#fff;--head-ink:#1d1d1d;--sub:#0f6e63;--sub-ink:#fff;--hero:#dff0ea;--link:#0c6b5f;--hfont:Figtree,sans-serif;--hweight:800;--hspace:-.015em;--h2size:28px}
/* promo + header */
.promo{display:flex;align-items:center;justify-content:center;gap:10px;height:34px;background:var(--promo);color:var(--promo-ink);font-size:13.5px;font-weight:500;padding:0 12px;white-space:nowrap;overflow:hidden}
.promo b{background:#1d1d1d;color:#fff;border-radius:14px;padding:3px 10px;font-size:12.5px;font-weight:700}
.mj .promo b{background:#fff;color:#120e0b}
.ph .promo b{background:#fff;color:#0f6e63}
.hdr{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;height:60px;padding:0 20px;background:var(--head);color:var(--head-ink);border-bottom:1px solid rgba(0,0,0,.08)}
.mj .hdr{border-bottom:0}
.wm{flex:1;display:flex;align-items:center;min-width:0}
.wm .parade{font:800 22px/1 Fraunces,Georgia,serif;letter-spacing:-.02em}
.wm .mjw{font:400 31px/1 "Bebas Neue",Impact,sans-serif;letter-spacing:.02em}
.wm .phw{font:800 22px/1 Figtree,sans-serif;letter-spacing:-.03em;color:#0f6e63;display:flex;align-items:center;gap:6px}
.navl{display:none;gap:22px;font-size:14px;font-weight:600}
.subs{height:34px;padding:0 18px;border-radius:18px;background:var(--sub);color:var(--sub-ink);font-weight:700;font-size:14px}
.mj .subs{font:400 16px/34px "Bebas Neue",sans-serif;letter-spacing:.04em}
.burger{width:34px;height:34px;display:flex;align-items:center;justify-content:center}
/* hero */
.wrap{max-width:1240px;margin:0 auto;padding:0 16px}
.hero{margin:16px 0 0;background:var(--hero);border-radius:14px;display:grid;gap:18px;padding:16px}
.hero .im{position:relative;border-radius:10px;overflow:hidden;aspect-ratio:4/3;background:#d9d2c5}
.hero .im img{width:100%;height:100%;object-fit:cover}
.hero .cap{position:absolute;left:0;right:0;bottom:0;padding:22px 12px 9px;font-size:11.5px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.55))}
.chip{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:12px;border:1px solid rgba(0,0,0,.18);background:var(--chip);font-size:12px;font-weight:600}
.mj .chip{font:400 14px/22px "Bebas Neue",sans-serif;letter-spacing:.04em}
h1{font-family:var(--hfont);font-weight:var(--hweight);letter-spacing:var(--hspace);text-transform:var(--hcase);font-size:32px;line-height:1.06;margin:12px 0 10px}
.mj h1{font-size:44px;line-height:.98}
.dek{font-size:18px;line-height:1.38;margin:0 0 12px}
.date{font-size:13px;font-weight:600;margin-bottom:12px}
.by{display:flex;align-items:center;gap:10px;font-size:13px}
.by img{width:34px;height:34px;border-radius:50%;object-fit:cover}
.by b{text-decoration:underline;text-underline-offset:2px}
.by small{display:block;font-size:12px;color:#555}
.follow{margin-left:8px;height:32px;padding:0 14px;border-radius:16px;border:1.5px solid rgba(0,0,0,.25);font-size:13px;font-weight:600}
/* body */
.cols{display:grid;gap:32px;margin-top:26px}
.rel{display:none}
.rel h3{font:700 20px/1.2 Figtree,sans-serif;margin:0 0 14px}
.rel a{display:flex;gap:10px;padding:12px 0;border-top:1px solid rgba(0,0,0,.08);color:inherit;text-decoration:none}
.rel a span{font-size:15px;font-weight:700;line-height:1.25;flex:1}
.rel a small{display:block;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin-bottom:4px;color:#555}
.rel a img{width:78px;height:62px;border-radius:8px;object-fit:cover;flex:none}
.art{max-width:700px;width:100%;margin:0 auto 0 0}
.topics{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;margin-bottom:18px}
.art p{font-size:18.5px;line-height:1.6;margin:0 0 20px}
.art h2{font-family:var(--hfont);font-weight:var(--hweight);font-size:var(--h2size);line-height:1.1;margin:34px 0 12px;letter-spacing:var(--hspace)}
.art figure{margin:6px 0 24px}
.art figure img{width:100%;border-radius:10px;aspect-ratio:3/2;object-fit:cover;background:#eee}
.art figcaption{font-size:12.5px;color:#666;margin-top:6px}
.art a.il{color:inherit;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.endc{display:flex;gap:12px;align-items:center;border-top:1px solid rgba(0,0,0,.1);padding:18px 0 140px;font-size:14px;color:#444}
.endc img{width:44px;height:44px;border-radius:50%;object-fit:cover}
/* AdZen in-text ads */
.az{white-space:normal}
.az u{text-decoration:none;color:var(--link);font-weight:600;border-bottom:1.5px dotted currentColor;cursor:pointer;padding-bottom:1px}
.az sup{display:inline-block;vertical-align:2px;margin-left:5px;padding:0 4px;border:1px solid #c2c2c2;border-radius:4px;font:700 10px/15px Figtree,system-ui,sans-serif;color:#6c6c6c;letter-spacing:.02em}
.az.on u{background:color-mix(in srgb,var(--link) 12%,transparent);border-bottom-style:solid}
.azpop{position:absolute;z-index:58;width:320px;max-width:calc(100% - 24px);background:#fff;border-radius:14px;box-shadow:0 14px 40px rgba(0,0,0,.24),0 0 0 1px rgba(0,0,0,.06);overflow:hidden;opacity:0;transform:translateY(4px);transition:opacity .16s,transform .16s;font-family:Figtree,system-ui,sans-serif}
.azpop.on{opacity:1;transform:none}
.azpop[hidden]{display:none}
.azpop .h{display:flex;align-items:center;gap:9px;padding:10px 12px}
.azpop .lg{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px;color:#fff;overflow:hidden;flex:none;border:1px solid rgba(0,0,0,.06)}
.azpop .lg img{width:100%;height:100%;object-fit:cover}
.azpop .h b{flex:1;font-size:14px}
.azpop .h span{font-size:11px;font-weight:700;color:#777;border:1px solid #d0d0d0;border-radius:4px;padding:0 4px;line-height:15px}
.azpop .flick{width:100%;aspect-ratio:1/1;background:#f2f2f2}
.azpop .f{display:flex;align-items:center;gap:10px;padding:11px 12px 13px}
.azpop .f .t{flex:1;min-width:0;font-size:13.5px;line-height:1.3;font-weight:700}
.azpop .f .t small{display:block;font-weight:500;color:#777;font-size:12px;margin-top:2px}
.azpop .cta{flex:none;height:34px;padding:0 15px;border-radius:17px;background:#1d1d1d;color:#fff;font-size:13.5px;font-weight:700;white-space:nowrap}
.leave{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:70;width:min(340px,calc(100% - 32px));background:#fff;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.3);padding:20px;text-align:center}
.leave[hidden]{display:none}
.leave b{display:block;font-size:17px;margin-bottom:6px}
.leave p{font-size:13px;color:#666;word-break:break-all;margin:0 0 14px}
.leave button{width:100%;height:44px;border-radius:22px;font-weight:700}
.leave .go{background:#1d1d1d;color:#fff}.leave .no{margin-top:8px;border:1.5px solid #ccc}
.fk-note{padding:8px 16px 6px;border-top:1px solid rgba(255,255,255,.14);margin-top:4px;font:500 11px var(--fk-font,system-ui);color:rgba(255,255,255,.6)}
@media (min-width:760px){
  .hero{grid-template-columns:1fr 1.15fr;padding:20px;align-items:center}
  h1{font-size:40px}.mj h1{font-size:56px}
  .navl{display:flex}
}
@media (min-width:1080px){
  .cols{grid-template-columns:270px 1fr}
  .rel{display:block}
  .wrap{padding:0 24px}
}
</style>
