$('page').innerHTML=Object.keys(SITES).map(render).join('');
const $app=$('app');
$app.insertAdjacentHTML('beforeend',Object.entries(ADS).filter(([id,t])=>!t.cmt).map(([id,t])=>`<div class="azpop" id="pop-${id}" hidden onmouseenter="taKeep()" onmouseleave="taLater()"><div class="h">${logo(t.b)}<b>${ADV[t.b].name}</b><span>Ad</span></div><div class="flick" data-slot="${id}" data-brand="${t.b}" data-cta="native"></div><div class="f"><div class="t">${t.line}<small>${t.sub}</small></div><button class="cta" data-t="${id}-cta" onclick="native('${id}')">${t.cta}</button></div></div>`).join(''));

let site='parade';
function showSite(k){if(k===site&&$('s-'+k).classList.contains('on'))return;site=k;taHide(true);document.querySelectorAll('.site').forEach(s=>s.classList.toggle('on',s.id==='s-'+k));$('page').scrollTop=0;document.title=SITES[k].name+': '+SITES[k].title;setTimeout(()=>FlicksKit.scan(),30)}
document.querySelectorAll('.site').forEach(s=>s.classList.toggle('on',s.id==='s-parade'));

/* popovers */
let taOpen=null,taT=null,taGo=null;
function taPlace(id){const a=document.querySelector(`.az[data-ad="${id}"]`),p=$('pop-'+id);if(!a||!p)return;
 const ar=$app.getBoundingClientRect(),rs=[...a.getClientRects()],r=rs[rs.length-1]||a.getBoundingClientRect(),W=$app.clientWidth,H=$app.clientHeight,ph=p.offsetHeight||420,pw=p.offsetWidth;
 const hdr=document.querySelector('.site.on .hdr').getBoundingClientRect().bottom-ar.top;
 p.style.left=Math.min(Math.max(12,r.left-ar.left-40),W-pw-12)+'px';
 const below=r.bottom-ar.top+8,above=r.top-ar.top-ph-8;
 p.style.top=(below+ph<=H-8?below:above>=hdr+6?above:Math.max(hdr+6,Math.min(below,H-ph-8)))+'px'}
function taShow(id){if(taOpen&&taOpen!==id)taHide(true);clearTimeout(taT);taOpen=id;const p=$('pop-'+id);p.hidden=false;
 document.querySelector(`.az[data-ad="${id}"]`).classList.add('on');taPlace(id);requestAnimationFrame(()=>{taPlace(id);p.classList.add('on')});FlicksKit.scan()}

function taKeep(){clearTimeout(taT)}
function taLater(){clearTimeout(taT);taT=setTimeout(()=>taHide(),320)}

document.querySelectorAll('.az').forEach(a=>{const id=a.dataset.ad;
 if(HOVER){a.addEventListener('mouseenter',()=>{clearTimeout(taT);taT=setTimeout(()=>taShow(id),120)});a.addEventListener('mouseleave',taLater)}
 a.addEventListener('click',e=>{e.stopPropagation();taOpen===id?taHide():taShow(id)})});

const clean=u=>{u=String(u||'').replace(/\$\{[^}]*\}/g,'');const i=u.search(/https?:\/\//);if(i<0)return '';u=u.slice(i);try{if(new URL(u).pathname.length<2)return ''}catch(e){return ''}return u};
